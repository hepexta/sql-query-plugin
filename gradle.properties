# ---------------------------------------------------------------------------
# IntelliJ Platform Gradle Plugin 2.x properties
# ---------------------------------------------------------------------------

# Target IDE version. IntelliJ IDEA 2026.2 = build 262; 2026.2.3 is the current stable patch.
# Bump the patch level freely; this is the version the plugin is compiled and verified against.
pluginGroup=com.sqlquery
pluginName=Simple SQL Query
pluginVersion=1.2.0
# This plugin is MIT licensed (see LICENSE). Note that neither plugin.xml nor the IntelliJ
# Platform Gradle Plugin DSL has a field for this: JetBrains Marketplace records the licence
# on the plugin's Marketplace page, not in the build. Kept here as documentation only.
pluginLicense=MIT
platformType=IC
platformVersion=2026.2.3
# JDK used to compile and test. Must be >= the JBR bundled with platformVersion:
# IDEA 2026.2 ships JBR 25 and its class files are Java 25 bytecode.
javaToolchain=25
# Lowest IDE build the plugin installs into. 262 = 2026.2, the branch this is compiled and
# verified against. Do not lower this below the branch whose platform you compile with; the
# bytecode target follows javaToolchain above.
pluginSinceBuild=262
# No until-build on purpose: since build 243 the IDE no longer needs it and setting it
# prevents users from installing the plugin after an IDE upgrade.

org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
org.gradle.caching=true
org.gradle.configuration-cache=false
